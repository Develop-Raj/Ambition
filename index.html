<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ambition — Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
    </style>
  </head>
  <body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-name">Ambition</div>
          <div class="brand-sub">Discipline, tracked</div>
        </div>
      </div>
      <nav class="primary-nav" id="primary-nav"></nav>
      <div class="nav-section-label">Categories</div>
      <nav class="cat-nav" id="cat-nav"></nav>
      <div class="sidebar-footer">
        <div class="streak-pill">
          <div class="streak-flame">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 2 6 9 6 14a6 6 0 0 0 12 0c0-2-1-3.5-2-4.5.2 1.5-.5 2.5-1.5 2.5C13 12 13.5 9.5 12 2z"/></svg>
          </div>
          <div>
            <div class="streak-num mono" id="sidebar-streak">0</div>
            <div class="streak-label">Day streak</div>
          </div>
        </div>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" id="modal-body"></div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
  </body>
</html>
